[project]
name = "geneset-embedding-analysis"
version = "0.1.0"
description = "Gene-set embedding similarity pipeline (GeneRAIN) for manuscript reproduction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.2",
    "scikit-learn==1.7.2",
    "scipy==1.13.1",
    "matplotlib==3.10.6",
    "seaborn==0.13.2",
    "PyYAML==6.0.2",
    "tqdm==4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
